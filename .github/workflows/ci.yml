name: NovaCart tests and live quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_evaluation:
        description: Run the configured deployment model (uses provider credits)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pip check
      - name: Unit, API and real Redis integration tests
        env:
          REDIS_URL: redis://localhost:6379/0
          TEST_REDIS_URL: redis://localhost:6379/15
          REQUIRE_REAL_REDIS: "1"
        run: python -m pytest backend/tests -q -p no:cacheprovider
      - name: Validate evaluation labels and expected facts
        run: python benchmarks/evaluate_quality.py --validate-only
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/public/app.js
      - name: Explain live evaluation status
        run: |
          echo "Deterministic tests do not establish live model accuracy. The separate live-quality job runs on an explicit dispatch or main push with LIVE_EVAL_ENABLED=true." >> "$GITHUB_STEP_SUMMARY"

  live-quality:
    needs: tests
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.live_evaluation) ||
      (github.event_name == 'push' && vars.LIVE_EVAL_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REDIS_URL: redis://localhost:6379/0
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Require explicit provider credentials and model
        run: python -c "from backend.rag.pipeline import CustomerSupportGenerator; CustomerSupportGenerator().validate_configuration()"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt') }}
      - name: Live factual, citation, retrieval and refusal gates
        run: python benchmarks/evaluate_quality.py
      - name: Upload live evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-live-evaluation
          path: benchmarks/reports/evaluation_report.json
          if-no-files-found: warn
